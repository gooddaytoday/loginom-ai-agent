Alias /app "/usr/local/apache2/htdocs/client/"
<Directory "/usr/local/apache2/htdocs/client/">
    AllowOverride None
    Require all granted
</Directory>
<Location /app/ws/>
    ProxyPass "ws://dashboard-master-20261109-server:8080/ws/"
</Location>

Alias /app-debug "/usr/local/apache2/htdocs/client-debug/"
