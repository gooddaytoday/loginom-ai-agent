name: test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # release.yml runs this workflow as a release gate.
  workflow_call:

concurrency:
  # Keep every run on dev so cancelled checks do not pollute the default branch
  # commit history. PRs and other branches still share a group and cancel stale runs.
  # The `tests-` prefix keeps the group apart from callers such as release.yml
  # (group `release-<ref>`); sharing a group with the caller would cancel it.
  group: tests-${{ case(github.ref == 'refs/heads/dev', format('{0}-{1}', github.workflow, github.run_id), format('{0}-{1}', github.workflow, github.event.pull_request.number || github.ref)) }}
  cancel-in-progress: true

# Callers may pass no more than `contents: read`; nothing here needs more.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    shell: bash

jobs:
  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      # Exports LOGINOM_AI_AGENT_TEST_NODE (pinned Node) for the loginom-host process
      # tests; turbo.json passes it through to `@loginom-ai-agent/loginom-host#test`.
      - name: Setup Loginom pinned inputs
        uses: ./.github/actions/setup-loginom-inputs

      - name: Verify Loginom login and workspace address contract
        working-directory: packages/loginom-runtime
        run: '"$LOGINOM_AI_AGENT_TEST_NODE" --test test/connection-check.test.mjs client/test/workspace.test.mjs'

      - name: Verify explicit proxy environment with real Node networking
        working-directory: packages/desktop
        run: '"$LOGINOM_AI_AGENT_TEST_NODE" test/loginom/environment-proxy.ts'

      - name: Verify shared NO_PROXY dialect on Bun and Electron Node
        working-directory: packages/desktop
        run: |
          bun test/loginom/no-proxy-contract.mjs
          # bun install links Electron before its postinstall downloads the binary.
          electron_dir="$(node -p "require('path').dirname(require.resolve('electron/package.json'))")"
          if [ ! -x "$electron_dir/dist/electron" ]; then
            node "$electron_dir/install.js"
          fi
          ELECTRON_RUN_AS_NODE=1 "$electron_dir/dist/electron" test/loginom/no-proxy-contract.mjs

      - name: Verify resolved proxy environment does not crash Electron Node
        working-directory: packages/desktop
        run: bun test/loginom/sidecar-proxy-contract.mjs

      - name: Configure git identity
        run: |
          git config --global user.email "bot@opencode.ai"
          git config --global user.name "opencode"

      - name: Cache Turbo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: node_modules/.cache/turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ hashFiles('turbo.json', '**/package.json') }}-
            turbo-${{ runner.os }}-

      # Runs the `test` script of every workspace package; packages/desktop has none
      # and is covered by the `desktop` job below. `--continue` reports every failing
      # package instead of stopping at the first one; without it turbo 2.10 segfaults
      # while terminating the remaining tasks on GitHub-hosted runners. Streamed log
      # order shows which package is still running when a task hangs. Two parallel
      # tasks keep the agent CLI subprocess tests (15-30 s budgets) from starving on
      # the 4-vCPU runner; the agent suite is the long pole either way.
      - name: Run unit tests
        timeout-minutes: 30
        run: GITHUB_ACTIONS=false bun turbo test --continue --log-order=stream --concurrency=2

      - name: Check generated client
        working-directory: packages/client
        run: bun run check:generated

      - name: Run HttpApi exerciser gates
        working-directory: packages/agent
        run: bun run test:httpapi

  desktop:
    name: desktop
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      # Runs every desktop test file except src/main/draft-store.test.ts: draft-store.ts
      # imports `node:sqlite`, which Electron's Node provides but Bun 1.3.14 does not
      # ("No such built-in module: node:sqlite"), so `bun test` cannot load that module.
      - name: Run desktop tests
        working-directory: packages/desktop
        run: bun test --path-ignore-patterns=src/main/draft-store.test.ts

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The app e2e suite uses @playwright/test from the root catalog. Keep its browsers
      # apart from the pinned Loginom runtime browser (setup-loginom-inputs), which is a
      # different Playwright version.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          install-flags: --frozen-lockfile

      # Runs after setup-bun, which installs the latest Node 24, so 24.15 is first on PATH
      # for `bunx playwright` and `playwright test`.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Playwright 1.59 hangs while extracting Chromium with Node 24.16.
          node-version: "24.15"

      - name: Read Playwright version
        id: playwright-version
        run: |
          version=$(node -e 'console.log(require("./package.json").workspaces.catalog["@playwright/test"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright-version.outputs.version }}-chromium

      - name: Install Playwright system dependencies
        working-directory: packages/app
        run: bunx playwright install-deps chromium

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: packages/app
        run: bunx playwright install chromium

      - name: Run app e2e tests
        run: bun --cwd packages/app test:e2e:local
        env:
          CI: true
          # Leave CPU for Vite and the browser compositor on the four-core runner.
          PLAYWRIGHT_WORKERS: "2"
        timeout-minutes: 30

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-linux-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            packages/app/e2e/test-results
            packages/app/e2e/playwright-report
