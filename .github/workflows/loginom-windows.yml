name: Loginom Windows candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/loginom-windows.yml"
      - "bun.lock"
      - "package.json"
      - "script/build-windows.ps1"
      - "packages/opencode/**"
      - "packages/app/**"
      - "packages/desktop/**"
      - "packages/loginom-host/**"
      - "packages/loginom-runtime/**"
      - "packages/product/**"
      - "packages/schema/**"
      - "packages/ui/**"

permissions:
  contents: read

concurrency:
  group: loginom-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-package-test:
    # Owner decision v040-ci-platform-batches: pull requests build platform candidates only for integration
    # batches and release PRs; node PRs skip (a skipped job still satisfies required checks).
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'v040-batch-') || contains(fromJSON('["dev","loginom"]'), github.base_ref)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      LOGINOM_AI_AGENT_CHANNEL: dev
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json

      - name: Resolve pinned portable inputs
        shell: pwsh
        run: |
          $node = (Get-Command node.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          $bun = (Get-Command bun.exe -CommandType Application -ErrorAction Stop | Select-Object -First 1).Source
          if ((& $node --version) -ne "v24.19.0") { throw "Unexpected Node version" }
          $expectedBunVersion = (Get-Content -Raw -LiteralPath "package.json" | ConvertFrom-Json).packageManager -replace '^bun@', ''
          if ((& $bun --version) -ne $expectedBunVersion) { throw "Expected Bun $expectedBunVersion" }
          $browsers = Join-Path $env:RUNNER_TEMP "loginom-browsers"
          New-Item -ItemType Directory -Force -Path $browsers | Out-Null
          "PLAYWRIGHT_BROWSERS_PATH=$browsers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOGINOM_AI_AGENT_BROWSER_SOURCE=$browsers" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOGINOM_WINDOWS_OUTPUT=$(Join-Path $env:RUNNER_TEMP 'loginom-windows')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOGINOM_CI_NODE_SOURCE=$node" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LOGINOM_CI_BUN_PATH=$bun" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Provision pinned Chromium input
        working-directory: packages/loginom-runtime/client
        shell: pwsh
        run: |
          npm ci --ignore-scripts --omit=dev --no-audit --fund=false --workspaces=false
          & $env:LOGINOM_CI_NODE_SOURCE node_modules/playwright/cli.js install chromium
          $release = Get-Content -LiteralPath ../../product/loginom-release.json -Raw | ConvertFrom-Json
          $browser = Join-Path $env:PLAYWRIGHT_BROWSERS_PATH "chromium-$($release.chromiumRevision)\chrome-win64\chrome.exe"
          if (-not (Test-Path -LiteralPath $browser -PathType Leaf)) { throw "Pinned Chromium executable is missing: $browser" }

      - name: Build Desktop and CLI from a clean checkout
        shell: pwsh
        run: |
          & .\script\build-windows.ps1 `
            -Product Both `
            -OutputDirectory (Join-Path $env:RUNNER_TEMP "loginom-windows") `
            -NodeSource $env:LOGINOM_CI_NODE_SOURCE `
            -BrowserSource $env:LOGINOM_AI_AGENT_BROWSER_SOURCE `
            -BunPath $env:LOGINOM_CI_BUN_PATH `
            -Channel dev

      - name: Install, execute and remove the CLI ZIP candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = @(Get-ChildItem -LiteralPath $env:LOGINOM_WINDOWS_OUTPUT -Filter "loginom-ai-agent-cli-*-win32-x64.zip" -File)
          if ($archive.Count -ne 1) { throw "Expected exactly one CLI archive" }
          $root = Join-Path $env:RUNNER_TEMP "cli-installed-smoke"
          if (Test-Path -LiteralPath $root) { throw "CLI smoke directory must be new" }
          $extracted = Join-Path $root "extracted"
          $local = Join-Path $root "Local App Data"
          New-Item -ItemType Directory -Path $extracted, $local | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf $archive[0].FullName -C $extracted
          if ($LASTEXITCODE -ne 0) { throw "CLI extraction failed" }
          $manifest = Get-Content -Raw -LiteralPath (Join-Path $extracted "cli-manifest.json") | ConvertFrom-Json
          $base = Join-Path $local "Programs\loginom-ai-agent-cli"
          $destination = Join-Path $base "$($manifest.metadata.version)-$($manifest.metadata.channel)"
          $launcher = Join-Path $base "bin\loginom-ai-agent-cli.cmd"
          $registryRoots = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
          )
          $recordsBefore = @($registryRoots | ForEach-Object { Get-ChildItem -LiteralPath $_ -ErrorAction SilentlyContinue } | ForEach-Object Name | Sort-Object) | ConvertTo-Json -Compress
          $userPathBefore = [Environment]::GetEnvironmentVariable("Path", "User")
          $machinePathBefore = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $previousLocal = $env:LOCALAPPDATA
          try {
            $env:LOCALAPPDATA = $local
            & (Join-Path $extracted "install.cmd")
            if ($LASTEXITCODE -ne 0) { throw "CLI install.cmd failed" }
            if (-not (Test-Path -LiteralPath $launcher -PathType Leaf)) { throw "Installed launcher is missing" }
            $version = & $launcher --version
            if ($LASTEXITCODE -ne 0) { throw "Installed CLI --version failed" }
            if (($version -join "`n").Trim() -ne $manifest.metadata.version) { throw "Installed CLI version does not match manifest" }
            & $env:LOGINOM_CI_BUN_PATH packages/loginom-host/script/verify-cli-candidate.ts $destination $env:GITHUB_WORKSPACE
            if ($LASTEXITCODE -ne 0) { throw "Installed candidate manifest/source/input verification failed" }
          } finally {
            try {
              if (Test-Path -LiteralPath (Join-Path $base "current.json")) {
                & (Join-Path $extracted "uninstall.cmd")
                if ($LASTEXITCODE -ne 0) { throw "CLI uninstall.cmd failed" }
              }
            } finally { $env:LOCALAPPDATA = $previousLocal }
          }
          # The user installer deliberately retains its two empty container directories.
          if (Test-Path -LiteralPath $destination) { throw "CLI payload survived uninstall" }
          $remaining = @(Get-ChildItem -LiteralPath $base -Recurse -Force | Where-Object { -not $_.PSIsContainer -or $_.FullName -ne (Join-Path $base "bin") })
          if ($remaining.Count -ne 0) { throw "CLI files, receipt or install lock survived uninstall" }
          $recordsAfter = @($registryRoots | ForEach-Object { Get-ChildItem -LiteralPath $_ -ErrorAction SilentlyContinue } | ForEach-Object Name | Sort-Object) | ConvertTo-Json -Compress
          if ($recordsAfter -cne $recordsBefore) { throw "CLI install/uninstall changed installed-application registry entries" }
          if ([Environment]::GetEnvironmentVariable("Path", "User") -cne $userPathBefore -or [Environment]::GetEnvironmentVariable("Path", "Machine") -cne $machinePathBefore) { throw "CLI install/uninstall changed persistent PATH" }
          [ordered]@{ version = $version; installedManifestVerified = $true; uninstalled = $true; filesAndReceiptRemoved = $true; registryAndPathUnchanged = $true } |
            ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:LOGINOM_WINDOWS_OUTPUT "cli-installed-smoke.json") -Encoding utf8

      - name: Desktop safeStorage DPAPI across Electron restarts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "desktop-safe-storage-smoke"
          if (Test-Path -LiteralPath $root) { throw "safeStorage smoke directory must be new" }
          New-Item -ItemType Directory -Path $root | Out-Null
          $env:LOGINOM_SAFE_STORAGE_CODEC = Join-Path $root "credentials.cjs"
          & $env:LOGINOM_CI_BUN_PATH build packages/desktop/src/main/loginom/credentials.ts --target=node --format=cjs --outfile=$env:LOGINOM_SAFE_STORAGE_CODEC
          if ($LASTEXITCODE -ne 0) { throw "Production Desktop credential codec bundling failed" }
          $electron = Join-Path $env:GITHUB_WORKSPACE "node_modules\electron\dist\electron.exe"
          if (-not (Test-Path -LiteralPath $electron -PathType Leaf)) { throw "Installed Electron is missing" }
          $script = Join-Path $env:GITHUB_WORKSPACE "packages\desktop\test\loginom\safe-storage-smoke.cjs"
          $env:LOGINOM_SAFE_STORAGE_PROFILE = Join-Path $root "profile"
          New-Item -ItemType Directory -Path $env:LOGINOM_SAFE_STORAGE_PROFILE | Out-Null
          $env:LOGINOM_SAFE_STORAGE_DATA = Join-Path $root "credentials.json"
          foreach ($mode in @("write", "read", "unavailable")) {
            $env:LOGINOM_SAFE_STORAGE_MODE = $mode
            $env:LOGINOM_SAFE_STORAGE_EVIDENCE = Join-Path $env:LOGINOM_WINDOWS_OUTPUT "safe-storage-$mode.json"
            if ($mode -eq "unavailable") { $env:LOGINOM_SAFE_STORAGE_DATA = Join-Path $root "must-not-exist.json" }
            $process = Start-Process -FilePath $electron -ArgumentList @('"' + $script + '"') -PassThru -RedirectStandardOutput (Join-Path $root "$mode.stdout") -RedirectStandardError (Join-Path $root "$mode.stderr")
            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force
              throw "safeStorage $mode timed out"
            }
            if ($process.ExitCode -ne 0) {
              Get-Content -LiteralPath (Join-Path $root "$mode.stderr")
              throw "safeStorage $mode failed with exit code $($process.ExitCode)"
            }
            $result = Get-Content -Raw -LiteralPath $env:LOGINOM_SAFE_STORAGE_EVIDENCE | ConvertFrom-Json
            if ($result.mode -ne $mode) { throw "Unexpected safeStorage evidence mode" }
            if ($mode -eq "unavailable") {
              if ($result.plaintextFallback -ne $false -or $result.encodeRejected -ne $true -or $result.decodeRejected -ne $true) { throw "safeStorage did not fail closed" }
              if (Test-Path -LiteralPath $env:LOGINOM_SAFE_STORAGE_DATA) { throw "Unavailable protection persisted credentials" }
            } elseif ($result.available -ne $true -or $result.roundtrip -ne $true -or $result.tamperRejected -ne $true) {
              throw "safeStorage roundtrip/tamper verification failed"
            }
            $result | ConvertTo-Json -Compress
          }

      - name: Run package-local checks
        shell: pwsh
        run: |
          & $env:LOGINOM_CI_NODE_SOURCE --test packages/desktop/test/loginom/windows-sidecar-smoke.test.mjs
          if ($LASTEXITCODE -ne 0) { throw "Installed sidecar probe regression tests failed" }
          & .\packages\desktop\test\loginom\windows-installed-smoke.test.ps1 `
            -RipgrepPath .\packages\desktop\resources\loginom\ripgrep\rg.exe
          if ($LASTEXITCODE -ne 0) { throw "Installed smoke regression tests failed" }
          Push-Location packages/desktop
          try {
            & $env:LOGINOM_CI_BUN_PATH typecheck
            if ($LASTEXITCODE -ne 0) { throw "Desktop typecheck failed" }
            & $env:LOGINOM_CI_BUN_PATH test electron-builder.config.test.ts scripts/copy-icons.test.ts scripts/release/artifact.test.ts src/main/apps.test.ts
            if ($LASTEXITCODE -ne 0) { throw "Desktop Windows package tests failed" }
          } finally { Pop-Location }
          Push-Location packages/loginom-host
          try {
            $env:LOGINOM_AI_AGENT_TEST_NODE = $env:LOGINOM_CI_NODE_SOURCE
            & $env:LOGINOM_CI_BUN_PATH typecheck
            if ($LASTEXITCODE -ne 0) { throw "Host typecheck failed" }
            & $env:LOGINOM_CI_BUN_PATH test test/environment.test.ts test/cli-credentials.test.ts test/cli-install-windows.test.ts test/cli-manifest.test.ts test/process.test.ts
            if ($LASTEXITCODE -ne 0) { throw "CLI Windows package tests failed" }
          } finally { Pop-Location }
          Push-Location packages/opencode
          try {
            & $env:LOGINOM_CI_BUN_PATH typecheck
            if ($LASTEXITCODE -ne 0) { throw "Agent typecheck failed" }
            & ..\..\script\test-windows-profile.ps1 -BunPath $env:LOGINOM_CI_BUN_PATH
            if ($LASTEXITCODE -ne 0) { throw "Windows profile tests failed" }
          } finally { Pop-Location }

      - name: Verify unsigned candidate outputs
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "loginom-windows"
          $installer = @(Get-ChildItem -LiteralPath (Join-Path $output "desktop") -Filter "*-win-x64.exe" -File)
          $archive = @(Get-ChildItem -LiteralPath $output -Filter "loginom-ai-agent-cli-*-win32-x64.zip" -File)
          if ($installer.Count -ne 1) { throw "Expected exactly one Desktop installer, found $($installer.Count)" }
          if ($archive.Count -ne 1) { throw "Expected exactly one CLI archive, found $($archive.Count)" }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer[0].FullName
          if ($signature.Status -ne "NotSigned") { throw "Expected an unsigned development installer, got $($signature.Status)" }
          $checksumPath = $archive[0].FullName + ".sha256"
          if (-not (Test-Path -LiteralPath $checksumPath -PathType Leaf)) { throw "CLI checksum is missing" }
          $expected = ((Get-Content -LiteralPath $checksumPath -Raw).Trim() -split "\s+")[0]
          $actual = (Get-FileHash -LiteralPath $archive[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($expected -ne $actual) { throw "CLI archive checksum mismatch" }
          $summary = [ordered]@{
            commit = $env:GITHUB_SHA
            runner = "windows-2022"
            channel = "dev"
            signed = $false
            node = (& $env:LOGINOM_CI_NODE_SOURCE --version)
            bun = (& $env:LOGINOM_CI_BUN_PATH --version)
            chromium_revision = (Get-Content -LiteralPath packages/product/loginom-release.json -Raw | ConvertFrom-Json).chromiumRevision
            desktop = [ordered]@{ name = $installer[0].Name; bytes = $installer[0].Length; sha256 = (Get-FileHash -LiteralPath $installer[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
            cli = [ordered]@{ name = $archive[0].Name; bytes = $archive[0].Length; sha256 = $actual }
          }
          $summary | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath (Join-Path $output "ci-summary.json") -Encoding utf8

      - name: Install, launch and uninstall Desktop candidate
        shell: pwsh
        timeout-minutes: 15
        run: |
          $installer = @(Get-ChildItem -LiteralPath (Join-Path $env:LOGINOM_WINDOWS_OUTPUT "desktop") -Filter "*-win-x64.exe" -File)
          if ($installer.Count -ne 1) { throw "Expected exactly one Desktop installer" }
          $version = (Get-Content -LiteralPath packages/desktop/package.json -Raw | ConvertFrom-Json).version
          # Negative control: same installer and smoke, one declared skill removed
          # from the disposable installed payload. No source/product substitutions.
          $redRoot = Join-Path $env:LOGINOM_WINDOWS_OUTPUT "installed-smoke-missing-skill"
          & .\packages\desktop\test\loginom\windows-installed-smoke.ps1 `
            -Installer $installer[0].FullName -RunRoot $redRoot `
            -ExpectedVersion $version -Channel dev -AllowServer -KeepProxy -PayloadMutation MissingSkill
          $redExit = $LASTEXITCODE
          $red = Get-Content -LiteralPath (Join-Path $redRoot "report.json") -Raw | ConvertFrom-Json
          if ($redExit -ne 1 -or $red.status -ne 'FAIL' -or
              @($red.checks | Where-Object { $_.id -eq 'sidecar-bundled-skills' -and $_.status -eq 'FAIL' -and $_.detail -match 'names/count differ' }).Count -ne 1) {
            throw "Missing installed skill was not rejected by the sidecar catalog check"
          }
          if (@($red.checks | Where-Object { $_.id -eq 'sidecar-local-help' -and $_.status -eq 'PASS' }).Count -ne 1) {
            throw "Negative control must still execute local Help successfully"
          }
          if (@($red.checks | Where-Object { $_.id -eq 'cleanup' -and $_.status -eq 'PASS' }).Count -ne 1) {
            throw "Mutated candidate cleanup failed"
          }
          Write-Host 'PASS negative control: missing installed loginom-automation makes smoke FAIL'
          & .\packages\desktop\test\loginom\windows-installed-smoke.ps1 `
            -Installer $installer[0].FullName `
            -RunRoot (Join-Path $env:LOGINOM_WINDOWS_OUTPUT "installed-smoke") `
            -ExpectedVersion $version -Channel dev -AllowServer -KeepProxy

      - name: Upload installed Desktop smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loginom-windows-installed-smoke-${{ github.run_id }}
          path: |
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/installed-smoke/report.json
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/installed-smoke/sidecar.json
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/installed-smoke/logs.zip
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/installed-smoke-missing-skill/report.json
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/installed-smoke-missing-skill/sidecar.json
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/installed-smoke-missing-skill/logs.zip
          if-no-files-found: warn
          retention-days: 7

      - name: Upload short-lived unsigned candidates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: loginom-windows-unsigned-${{ github.run_id }}
          path: |
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/desktop/*-win-x64.exe
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/loginom-ai-agent-cli-*-win32-x64.zip
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/loginom-ai-agent-cli-*-win32-x64.zip.sha256
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/ci-summary.json
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/cli-installed-smoke.json
            ${{ env.LOGINOM_WINDOWS_OUTPUT }}/safe-storage-*.json
          if-no-files-found: error
          retention-days: 7
