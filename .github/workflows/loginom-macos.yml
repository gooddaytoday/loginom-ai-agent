name: Loginom macOS candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Candidate version (empty uses run number)
        type: string
  push:
    branches: [macos-build, loginom]
    paths: ["packages/**", "patches/**", "bun.lock", "package.json", ".github/workflows/loginom-macos.yml"]
  pull_request:
    paths: ["packages/**", "patches/**", "bun.lock", "package.json", ".github/workflows/loginom-macos.yml"]

permissions:
  contents: read

concurrency:
  group: loginom-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 120
    env:
      LOGINOM_AI_AGENT_CHANNEL: dev
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
          architecture: arm64
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Provision locked build inputs
        run: |
          test "$(uname -m)" = arm64
          test "$(sw_vers -productVersion | cut -d. -f1)" = 14
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/loginom-browsers"
          echo "PLAYWRIGHT_BROWSERS_PATH=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          echo "LOGINOM_AI_AGENT_BROWSER_SOURCE=$PLAYWRIGHT_BROWSERS_PATH" >> "$GITHUB_ENV"
          bun install --frozen-lockfile --filter loginom-ai-agent --filter '@loginom-ai-agent/desktop' --filter '@loginom-ai-agent/agent' --filter '@loginom-ai-agent/loginom-host' --filter '@loginom-ai-agent/product'
          node packages/desktop/node_modules/electron/install.js
          echo "LOGINOM_AI_AGENT_NODE_SOURCE=$(command -v node)" >> "$GITHUB_ENV"
          echo "LOGINOM_AI_AGENT_TEST_NODE=$(command -v node)" >> "$GITHUB_ENV"
          cd packages/loginom-runtime/client
          npm ci --ignore-scripts --omit=dev --no-audit --fund=false --workspaces=false
          node node_modules/playwright/cli.js install chromium
      - name: Source checks
        run: bun packages/desktop/scripts/check-macos.ts "$RUNNER_TEMP/source-checks.json"
      - name: Read system proxy
        run: bun packages/loginom-host/script/system-proxy-smoke.ts
      - name: Build and verify both products
        env:
          CANDIDATE_VERSION: ${{ inputs.version || format('0.1.4-macos.{0}', github.run_number) }}
          # The config fixes identity to '-' (ad-hoc); no certificate or notarization secrets.
          # Otherwise electron-builder skips even this local signature on pull requests.
          CSC_FOR_PULL_REQUEST: "true"
          # Bundling the backend into Electron exceeds Node's default 2 GiB heap on this runner.
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun packages/desktop/scripts/build-macos.ts --output "$RUNNER_TEMP/candidate" --version "$CANDIDATE_VERSION"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: loginom-macos14-arm64-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/candidate/*.dmg
            ${{ runner.temp }}/candidate/*.zip
            ${{ runner.temp }}/candidate/*.tar.gz
            ${{ runner.temp }}/candidate/*.sha256
            ${{ runner.temp }}/candidate/*.json
            ${{ runner.temp }}/candidate/SHA256SUMS
            ${{ runner.temp }}/candidate/cli/cli-manifest.json
            ${{ runner.temp }}/source-checks.json
          retention-days: 14
