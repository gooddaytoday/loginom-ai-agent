name: secrets

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [loginom]

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    if: github.event.deleted != true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The graph must be complete; the scanner reads only the selected range.
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"
      - name: Install scanner tooling only
        run: |
          export TMPDIR="$RUNNER_TEMP"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          bun install --frozen-lockfile --ignore-scripts --filter @loginom-ai-agent/script
          bun run secrets:install
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify scanner behavior
        working-directory: packages/script
        run: |
          bun test
          bun typecheck
      - name: Scan only incoming commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base=$(git merge-base "$BASE" "$HEAD")
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            base=$(git merge-base origin/loginom "$HEAD")
          else
            base="$BEFORE"
          fi
          bun run secrets range "$base" "$HEAD"
