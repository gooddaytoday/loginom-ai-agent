name: Windows native checks
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "packages/loginom-host/**"
      - "packages/agent/src/cli/profile-windows.ts"
      - "packages/agent/test/cli/profile-windows.test.ts"
      - ".github/workflows/windows-native-check.yml"
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install locked native test dependencies
        run: bun install --frozen-lockfile --linker hoisted --ignore-scripts --filter '@loginom-ai-agent/loginom-host' --filter '@loginom-ai-agent/agent'
      - name: Verify native host
        working-directory: packages/loginom-host
        run: |
          $env:LOGINOM_AI_AGENT_TEST_NODE = (Get-Command node).Source
          bun typecheck
          if ($LASTEXITCODE -ne 0) { throw "Host typecheck failed" }
          bun test test/windows-powershell.test.ts test/native-proxy.test.ts test/cli-credentials.test.ts test/cli-install-windows.test.ts test/cli-manifest.test.ts test/process.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Native host tests failed" }
      - name: Verify native profile
        # This pure OS helper needs no agent server bootstrap/teardown preload.
        working-directory: packages/loginom-host
        run: |
          bun test ../agent/test/cli/profile-windows.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Windows profile tests failed" }
