name: Windows native checks
on:
  workflow_dispatch:
    inputs:
      baseline:
        description: "Optional baseline SHA for cold/warm proxy and DPAPI measurements on fresh runners"
        type: string
        default: ""
  push:
    branches: ["**"]
    paths:
      - "packages/loginom-host/**"
      - "packages/desktop/src/main/apps.ts"
      - "packages/desktop/src/main/apps.test.ts"
      - "packages/opencode/src/cli/profile-windows.ts"
      - "packages/opencode/test/cli/profile-windows.test.ts"
      - "script/test-windows-profile.ps1"
      - ".github/workflows/windows-native-check.yml"
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24.19.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install locked native test dependencies
        run: bun install --frozen-lockfile --linker hoisted --ignore-scripts --filter '@loginom-ai-agent/loginom-host'
      - name: Verify native host
        working-directory: packages/loginom-host
        run: |
          $env:LOGINOM_AI_AGENT_TEST_NODE = (Get-Command node).Source
          bun typecheck
          if ($LASTEXITCODE -ne 0) { throw "Host typecheck failed" }
          bun test test/windows-powershell.test.ts test/environment.test.ts test/cli-credentials.test.ts test/cli-install-windows.test.ts test/cli-manifest.test.ts test/process.test.ts test/system-proxy-io.test.ts
          if ($LASTEXITCODE -ne 0) { throw "Native host tests failed" }
      - name: Verify native profile
        run: ./script/test-windows-profile.ps1
      - name: Verify native application resolution in fresh processes
        working-directory: packages/desktop
        run: |
          # Each repetition must pass; these are independent cold starts, not retries.
          1..5 | ForEach-Object {
            bun test src/main/apps.test.ts
            if ($LASTEXITCODE -ne 0) { throw "Native application resolution failed on repetition $_" }
          }
      - name: Configure isolated WinINET proxy
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Proxy fixture requires a disposable GitHub-hosted runner'
          }
          $settings = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          Set-ItemProperty -Path $settings -Name ProxyEnable -Type DWord -Value 1
          Set-ItemProperty -Path $settings -Name ProxyServer -Value '127.0.0.1:18797'
          Set-ItemProperty -Path $settings -Name ProxyOverride -Value ''
          Set-ItemProperty -Path $settings -Name AutoDetect -Type DWord -Value 0
          Remove-ItemProperty -Path $settings -Name AutoConfigURL -ErrorAction SilentlyContinue
          # A missing sidecar proxy must fail locally, without contacting OpenAI.
          $hosts = Join-Path $env:SystemRoot 'System32\drivers\etc\hosts'
          Copy-Item -LiteralPath $hosts -Destination "$env:RUNNER_TEMP\system-proxy-hosts"
          Add-Content -LiteralPath $hosts -Encoding ascii -Value "`n127.0.0.1 api.openai.com auth.openai.com"
      - name: Assert system proxy in sidecar
        timeout-minutes: 2
        run: bun packages/loginom-host/script/system-proxy-smoke.ts --assert-windows
      - name: Disable WinINET proxy and restore hosts
        if: always()
        run: |
          $settings = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          Set-ItemProperty -Path $settings -Name ProxyEnable -Type DWord -Value 0
          if ((Get-ItemProperty -Path $settings -Name ProxyEnable).ProxyEnable -ne 0) {
            throw 'WinINET proxy was not disabled'
          }
          $backup = "$env:RUNNER_TEMP\system-proxy-hosts"
          if (Test-Path -LiteralPath $backup) {
            Copy-Item -LiteralPath $backup -Destination (Join-Path $env:SystemRoot 'System32\drivers\etc\hosts')
          }
          Write-Host 'WinINET ProxyEnable=0; hosts restored'

  timings:
    if: github.event_name == 'workflow_dispatch' && inputs.baseline != ''
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
        revision: [before, after]
        operation: [proxy, dpapi]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ matrix.revision == 'before' && inputs.baseline || github.sha }}
          path: timing-source
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.14"
      - name: Install locked reader dependencies
        run: bun install --frozen-lockfile --linker hoisted --ignore-scripts --filter '@loginom-ai-agent/loginom-host'
      - name: Configure isolated manual WinINET settings
        if: matrix.operation == 'proxy'
        shell: pwsh
        run: |
          $settings = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
          Set-ItemProperty -Path $settings -Name ProxyEnable -Type DWord -Value 1
          Set-ItemProperty -Path $settings -Name ProxyServer -Value '127.0.0.1:18797'
          Set-ItemProperty -Path $settings -Name ProxyOverride -Value ''
          Set-ItemProperty -Path $settings -Name AutoDetect -Type DWord -Value 0
          Remove-ItemProperty -Path $settings -Name AutoConfigURL -ErrorAction SilentlyContinue
      - name: Measure first and subsequent native subprocesses
        shell: pwsh
        env:
          TIMING_OPERATION: ${{ matrix.operation }}
          TIMING_REVISION: ${{ matrix.revision }}
        run: |
          $options = @('--measure-windows', '--source', './timing-source', '--operation', $env:TIMING_OPERATION)
          if ($env:TIMING_REVISION -eq 'after') { $options += '--require-success' }
          git -C timing-source rev-parse HEAD | Tee-Object -FilePath "$env:RUNNER_TEMP\native-timings.log"
          bun packages/loginom-host/script/system-proxy-smoke.ts @options | Tee-Object -FilePath "$env:RUNNER_TEMP\native-timings.log" -Append
          if ($LASTEXITCODE -ne 0) { throw 'Native timing samples failed' }
      - name: Restore manual WinINET settings
        if: always() && matrix.operation == 'proxy'
        shell: pwsh
        run: Set-ItemProperty -Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Internet Settings' -Name ProxyEnable -Type DWord -Value 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-timings-${{ matrix.os }}-${{ matrix.revision }}-${{ matrix.operation }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-timings.log
          if-no-files-found: error
          retention-days: 14
