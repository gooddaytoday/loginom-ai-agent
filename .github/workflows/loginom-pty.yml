name: Loginom pty

# Builds loginom-ai-agent-pty (packages/process-daemon) for the three product platforms. Consumers (Linux, Windows
# and macOS candidate builds) download the artifact loginom-ai-agent-pty-<target> and point LOGINOM_AI_AGENT_PTY_BIN
# at the executable; upload-artifact drops the executable bit, so chmod +x it first on Linux and macOS.

on:
  workflow_call:
    inputs:
      # JSON list of Rust targets to build, e.g. '["aarch64-apple-darwin"]'. Empty builds all three, as push,
      # pull_request and workflow_dispatch do. A candidate asks for its own platform only, so a missing runner or a
      # red target elsewhere cannot block it.
      targets:
        type: string
        default: ""
  workflow_dispatch:
  pull_request:
    paths:
      - packages/process-daemon/**
      - .github/actions/setup-rust-pty/**
      - .github/workflows/loginom-pty.yml
  # Stage B: the workflow is not on the default branch yet, so workflow_dispatch cannot reach it; B5.2b calls it from
  # loginom-release.yml instead.
  push:
    branches: [oc2-migration]
    paths:
      - packages/process-daemon/**
      - .github/actions/setup-rust-pty/**
      - .github/workflows/loginom-pty.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  GNU_GLIBC_VERSION: "2.30"
  CARGO_ZIGBUILD_VERSION: 0.23.2
  ALL_TARGETS: '["x86_64-unknown-linux-gnu","aarch64-apple-darwin","x86_64-pc-windows-msvc"]'

jobs:
  # A finished pty is cached by what goes into it. macOS arm64 runners are scarce, so a target whose cache entry exists
  # never starts a build job on its own runner: `reuse` restores it on ubuntu and uploads the same artifact.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      hash: ${{ steps.hash.outputs.value }}
      missing: ${{ steps.split.outputs.missing }}
      cached: ${{ steps.split.outputs.cached }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          sparse-checkout: |
            packages/process-daemon
            .github/actions/setup-rust-pty
            .github/workflows/loginom-pty.yml
          sparse-checkout-cone-mode: false

      # Every input of the binary: the sources and lockfile, the toolchain action, this workflow (pins, glibc, zigbuild)
      # and, per entry, the target.
      - name: Hash inputs
        id: hash
        run: echo "value=${{ hashFiles('packages/process-daemon/**', 'packages/process-daemon/Cargo.lock', '.github/actions/setup-rust-pty/**', '.github/workflows/loginom-pty.yml') }}" >> "$GITHUB_OUTPUT"

      - name: Targets
        id: targets
        env:
          REQUESTED: ${{ inputs.targets }}
        run: echo "all=${REQUESTED:-$ALL_TARGETS}" >> "$GITHUB_OUTPUT"

      - name: Look up Linux x64
        id: linux
        if: contains(steps.targets.outputs.all, 'x86_64-unknown-linux-gnu')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: pty-out
          key: pty-x86_64-unknown-linux-gnu-${{ steps.hash.outputs.value }}
          lookup-only: true
          enableCrossOsArchive: true

      - name: Look up macOS arm64
        id: macos
        if: contains(steps.targets.outputs.all, 'aarch64-apple-darwin')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: pty-out
          key: pty-aarch64-apple-darwin-${{ steps.hash.outputs.value }}
          lookup-only: true
          enableCrossOsArchive: true

      - name: Look up Windows x64
        id: windows
        if: contains(steps.targets.outputs.all, 'x86_64-pc-windows-msvc')
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: pty-out
          key: pty-x86_64-pc-windows-msvc-${{ steps.hash.outputs.value }}
          lookup-only: true
          enableCrossOsArchive: true

      - name: Split targets into cached and missing
        id: split
        env:
          HITS: linux=${{ steps.linux.outputs.cache-hit }} macos=${{ steps.macos.outputs.cache-hit }} windows=${{ steps.windows.outputs.cache-hit }}
          TARGETS: ${{ steps.targets.outputs.all }}
        run: |
          cached='[]'; missing='[]'
          for pair in linux:x86_64-unknown-linux-gnu macos:aarch64-apple-darwin windows:x86_64-pc-windows-msvc; do
            target="${pair#*:}"
            echo "$TARGETS" | jq -e --arg t "$target" 'index($t)' > /dev/null || continue
            if [[ " $HITS " == *" ${pair%%:*}=true "* ]]; then
              cached="$(jq -c --arg t "$target" '. + [$t]' <<< "$cached")"
            else
              missing="$(jq -c --arg t "$target" '. + [$t]' <<< "$missing")"
            fi
          done
          echo "cached=$cached" >> "$GITHUB_OUTPUT"
          echo "missing=$missing" >> "$GITHUB_OUTPUT"
          echo "cached: $cached, to build: $missing"

  # The binary was smoke-tested when it was built and entered the cache only after that, so a hit is not tested again.
  reuse:
    name: pty (${{ matrix.target }}, cached)
    needs: plan
    if: needs.plan.outputs.cached != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.cached) }}
    steps:
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: restore
        with:
          path: pty-out
          key: pty-${{ matrix.target }}-${{ needs.plan.outputs.hash }}
          fail-on-cache-miss: true
          enableCrossOsArchive: true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loginom-ai-agent-pty-${{ matrix.target }}
          path: pty-out/*
          if-no-files-found: error
          retention-days: 14

  pty:
    name: pty (${{ matrix.target }})
    needs: plan
    if: needs.plan.outputs.missing != '[]'
    runs-on: ${{ contains(matrix.target, 'linux') && 'ubuntu-22.04' || contains(matrix.target, 'apple') && 'macos-15' || 'windows-2022' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.missing) }}
    defaults:
      run:
        shell: bash
        working-directory: packages/process-daemon
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-rust-pty
        with:
          target: ${{ matrix.target }}

      - name: Install glibc baseline linker
        if: runner.os == 'Linux'
        run: cargo install cargo-zigbuild --locked --version "$CARGO_ZIGBUILD_VERSION"

      - name: Build
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            cargo zigbuild --locked --release --target "${{ matrix.target }}.$GNU_GLIBC_VERSION"
          else
            cargo build --locked --release --target "${{ matrix.target }}"
          fi

      - name: Verify glibc baseline
        if: runner.os == 'Linux'
        run: |
          binary="${CARGO_TARGET_DIR:-target}/${{ matrix.target }}/release/loginom-ai-agent-pty"
          required="$(readelf --version-info "$binary" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)+' | sed 's/GLIBC_//' | sort -V | tail -n 1)"
          echo "Highest required glibc version: $required"
          test "$(printf '%s\n' "$required" "$GNU_GLIBC_VERSION" | sort -V | tail -n 1)" = "$GNU_GLIBC_VERSION"

      - name: Smoke test
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          binary="${CARGO_TARGET_DIR:-target}/${{ matrix.target }}/release/loginom-ai-agent-pty$exe"
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "loginom-ai-agent-pty") | .version')"
          protocol="$(sed -nE 's/^pub const PROTOCOL_VERSION: u32 = ([0-9]+);\r?$/\1/p' src/protocol.rs)"
          test -n "$version" && test -n "$protocol"
          output="$("$binary" --version | tr -d '\r')"
          test "$output" = "loginom-ai-agent-pty $version (protocol $protocol)"
          # The play client has no Windows transport; Windows starts a real daemon instead (next step), as upstream does.
          if [ "$RUNNER_OS" = "Windows" ]; then exit 0; fi
          runtime="$RUNNER_TEMP/loginom-ai-agent-pty-smoke"
          rm -rf "$runtime"
          printf 'new /bin/sh -c "printf release-smoke; sleep 1"\nwait 250\nquit\n' | "$binary" play --runtime-dir "$runtime" --name smoke > "$RUNNER_TEMP/pty-smoke.log"
          grep -q 'release-smoke' "$RUNNER_TEMP/pty-smoke.log"
          grep -q 'checkpoint' "$RUNNER_TEMP/pty-smoke.log"

      - name: Smoke test the Windows daemon
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = Join-Path $env:CARGO_TARGET_DIR '${{ matrix.target }}/release/loginom-ai-agent-pty.exe'
          # Start a real daemon over a named pipe; it stops when nobody claims it (release-process-daemon.yml).
          $runtime = Join-Path $env:RUNNER_TEMP 'loginom-ai-agent-pty-smoke'
          $daemon = Start-Process $binary -ArgumentList @('daemon', '--runtime-dir', $runtime, '--name', 'smoke') -PassThru -NoNewWindow
          $deadline = (Get-Date).AddSeconds(10)
          while (!(Test-Path (Join-Path $runtime 'smoke/service.json'))) {
            if ($daemon.HasExited -or (Get-Date) -gt $deadline) { throw 'daemon did not register' }
            Start-Sleep -Milliseconds 50
          }
          if (!$daemon.WaitForExit(15000)) { $daemon.Kill(); throw 'unclaimed daemon did not stop' }
          if (Test-Path (Join-Path $runtime 'smoke')) { throw 'runtime directory was not removed' }

      - name: Collect
        run: |
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "$GITHUB_WORKSPACE/pty-out"
          cp "${CARGO_TARGET_DIR:-target}/${{ matrix.target }}/release/loginom-ai-agent-pty$exe" "$GITHUB_WORKSPACE/pty-out/"
          (cd "$GITHUB_WORKSPACE/pty-out" && sha256sum "loginom-ai-agent-pty$exe" > SHA256SUMS 2>/dev/null || shasum -a 256 "loginom-ai-agent-pty$exe" > SHA256SUMS)
          cat "$GITHUB_WORKSPACE/pty-out/SHA256SUMS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: loginom-ai-agent-pty-${{ matrix.target }}
          path: pty-out/*
          if-no-files-found: error
          retention-days: 14

      # Saved only after the build, the glibc check and the smoke test passed (a failed job saves nothing).
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: pty-out
          key: pty-${{ matrix.target }}-${{ needs.plan.outputs.hash }}
          enableCrossOsArchive: true
