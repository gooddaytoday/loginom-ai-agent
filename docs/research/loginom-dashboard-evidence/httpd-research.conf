LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule proxy_wstunnel_module modules/mod_proxy_wstunnel.so
Alias /app-debug "/usr/local/apache2/htdocs/client-debug/"
<Directory "/usr/local/apache2/htdocs/client-debug/">
    AllowOverride None
    Require all granted
</Directory>
<Location "/app/ws/">
    ProxyPass "ws://dashboard-research-20261103-server:8080/ws/"
</Location>
<Location "/app-debug/ws/">
    ProxyPass "ws://dashboard-research-20261103-server:8080/ws/"
</Location>
