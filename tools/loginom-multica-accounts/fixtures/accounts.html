<!doctype html><meta charset="utf-8">
<!-- Synthetic UI and RPC getter objects. No network, real accounts or secrets. -->
<div id="login">
  <label data-tid="LoginForm;Login;edtUsername"><input></label>
  <label data-tid="LoginForm;Login;edtPassword"><input type="password"></label>
  <button data-tid="LoginForm;Login;btnLogin">Login</button>
</div>
<button hidden data-tid="MF;cntMain;tlbMainToolbar;btnAvatar">Avatar</button>
<div id="menu" hidden><span data-tid="MF;AppMenuForm;p.h;p.t"></span>
  <button data-tid="MF;AppMenuForm;btnLogOut">Logout</button></div>
<div id="users" hidden><button data-tid="MF;TF;UserListForm;btnAdd">Add</button><div id="rows"></div></div>
<div id="user-form" hidden></div>
<div id="dispatcher" style="width: 400px; height: 80px" data-tid="MF;TF;SessionsManagerForm;trpSessions" hidden></div>
<script>
window.installAccounts = ({policy, existing = false, brokenDisconnect = false, wrongUser = false, reject = false} = {}) => {
  const by = name => document.querySelector(`[data-tid="${name}"]`);
  const rights = {IsDesigner: true, IsViewer: true, IsAdmin: false, AllowPublish: false,
    AllowPasswordSave: false, UseGlobalFileStorage: false, SchedulerFullAccess: false,
    MustChangePassword: false, Blocked: false};
  const app = {FServerConnection: null, FMainForm: null};
  window.bg = {app: {Application: {FInstance: app}, CurrentUser: {Get: () => ({IsAdmin: true})}},
    TBGManagedSessionType: {mstSelf: 1}};
  window.actions = [];
  window.connector = {$D: false, $T: {}, $GT() {return this.$T;}};
  window.accountGuid = 'ABCDEF00-1234-1234-1234-123456789ABC';
  by('LoginForm;Login;btnLogin').onclick = () => {
    actions.push('login');
    if (reject) { const error = document.createElement('span'); error.className = 'x-form-error-wrap'; error.textContent = 'Rejected'; document.body.append(error); return; }
    const username = wrongUser ? 'foreign' : by('LoginForm;Login;edtUsername').querySelector('input').value;
    const user = {get_Name: async () => username};
    for (const [name, value] of Object.entries(rights)) user['get_' + name] = async () => name === 'IsAdmin' ? username === 'admin' : value;
    const remote = {get_Guid: async () => window.accountGuid, $S: 'synthetic-session'};
    app.FServerConnection = {Connected: true, RemoteSession: remote, FRemoteSession: remote, Session: {},
      UserName: username, GetCurrentUser: async () => user, ServerContainer: {FServerConnector: connector}};
    app.FMainForm = {FMapTree: {PackageNodes: {Count: 0}}};
    document.querySelector('#login').hidden = true;
    by('MF;cntMain;tlbMainToolbar;btnAvatar').hidden = false;
    if (username === 'admin') document.querySelector('#users').hidden = false;
  };
  by('MF;cntMain;tlbMainToolbar;btnAvatar').onclick = () => {
    actions.push('avatar'); document.querySelector('#menu').hidden = false;
    by('MF;AppMenuForm;p.h;p.t').textContent = app.FServerConnection.UserName;
  };
  by('MF;AppMenuForm;btnLogOut').onclick = () => {
    actions.push('logout');
    const con = app.FServerConnection; app.FServerConnection = null; app.FMainForm = null;
    con.RemoteSession = con.FRemoteSession = con.Session = con.ServerContainer = null;
    if (!brokenDisconnect) {connector.$D = true; connector.$T = null;}
    document.querySelector('#login').hidden = false; document.querySelector('#menu').hidden = true;
    by('MF;cntMain;tlbMainToolbar;btnAvatar').hidden = true;
  };
  const prefix = 'MF;TF;UserListForm;UserForm;';
  const form = document.querySelector('#user-form');
  for (const name of ['edtLogin', 'edtFullName', 'edtPassword', 'cbxAuthMode'])
    form.insertAdjacentHTML('beforeend', `<label data-tid="${prefix + name}"><input></label>`);
  for (const name of Object.keys(policy)) {
    form.insertAdjacentHTML('beforeend', `<label data-tid="${prefix + name}"><button data-tid="${prefix + name};DisplayEl">${name}</button></label>`);
    by(prefix + name + ';DisplayEl').onclick = () => by(prefix + name).classList.toggle('x-form-cb-checked');
  }
  for (const name of ['btnApply', 'btnCancel']) form.insertAdjacentHTML('beforeend', `<button data-tid="${prefix + name}">${name}</button>`);
  let saved = existing ? {username: 'worker', marker: 'fixture-owned-marker', policy} : null;
  const input = name => by(prefix + name).querySelector('input');
  const show = values => {
    form.hidden = false; input('edtLogin').value = values?.username ?? ''; input('edtFullName').value = values?.marker ?? '';
    input('cbxAuthMode').value = 'Локальная';
    for (const name of Object.keys(policy)) by(prefix + name).classList.toggle('x-form-cb-checked', values?.policy[name] ?? false);
  };
  const row = () => {
    const rows = document.querySelector('#rows'); rows.replaceChildren();
    if (!saved) return;
    const element = document.createElement('span'); element.dataset.tid = 'MF;TF;UserListForm;cntTile;ListView;headercontainer;title_' + saved.username;
    element.textContent = saved.username; element.ondblclick = () => {actions.push('reopen'); show(saved);}; rows.append(element);
  };
  row();
  by('MF;TF;UserListForm;btnAdd').onclick = () => {actions.push('add'); show();};
  by(prefix + 'btnApply').onclick = () => {
    actions.push('apply'); saved = {username: input('edtLogin').value, marker: input('edtFullName').value,
      policy: Object.fromEntries(Object.keys(policy).map(name => [name, by(prefix + name).classList.contains('x-form-cb-checked')]))};
    form.hidden = true; row();
  };
  by(prefix + 'btnCancel').onclick = () => {actions.push('cancel'); form.hidden = true;};
};
window.installDispatcher = ({duplicate = false, changing = false, packages = true} = {}) => {
  const app = bg.app.Application.FInstance, con = app.FServerConnection;
  const element = document.querySelector('#dispatcher'); element.hidden = false;
  const date = new Date('2026-10-09T00:00:00Z');
  const pack = {Name: 'synthetic', Path: '/synthetic', CreateTime: date, ModifyTime: date, Version: 1, ReadOnly: true, ReferenceCount: 1};
  const pkg = Object.fromEntries(Object.entries(pack).map(([key, value]) => ['get_' + key, async () => value]));
  const infos = [1, 0].map((type, i) => ({$S: i ? 'foreign-session' : con.FRemoteSession.$S,
    get_Name: async () => (i ? 'foreign' : con.UserName) + ':' + (90 + i), get_CreateTime: async () => date,
    get_SessionType: async () => type, get_PendingDisconnect: async () => false,
    get_Count: async () => !i && packages ? 1 : 0, PackageInfo: async () => pkg}));
  const nodes = infos.map((info, i) => ({data: {Info: info, text: (i ? 'foreign' : con.UserName) + ':' + (90 + i),
    CreateTime: date, SessionType: i ? 0 : 1, PendingDisconnect: false}, childNodes: !i && packages ? [{data: {...pack, text: pack.Name, Info: pkg}}] : []}));
  const root = {childNodes: nodes, isLoaded: () => true};
  let reads = 0;
  const manager = {get_Count: async () => changing && reads++ ? 3 : 2, SessionInfo: async i => infos[duplicate ? 0 : i]};
  const previous = Ext.getCmp; Ext.getCmp = id => id === 'dispatcher' ? {Controller: {FSessionManager: manager}, getStore: () => ({getRoot: () => root})} : previous(id);
  window.dispatcherRoot = root;
};
</script>
